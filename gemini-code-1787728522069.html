<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사진 번호 관리 시스템</title>
  <style>
    * { box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
    body { margin: 20px; background-color: #f5f6f8; color: #333; }
    
    /* 상단 컨트롤 영역 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    .btn-group { display: flex; gap: 10px; }
    
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn-primary { background-color: #2b6cb0; color: white; }
    .btn-primary:hover { background-color: #2c5282; }
    .btn-success { background-color: #38a169; color: white; }
    .btn-success:hover { background-color: #2f855a; }
    .btn-info { background-color: #319795; color: white; }
    .btn-info:hover { background-color: #2c7a7b; }

    /* 메인 컨테이너 */
    .container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }
    
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    /* 입력 폼 */
    .photo-input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      align-items: center;
    }
    .photo-input-group input {
      width: 120px;
      padding: 8px;
      border: 1px solid #cbd5e0;
      border-radius: 4px;
      font-size: 16px;
      text-align: center;
    }

    /* 리스트 스타일 및 사진번호 등록 항목 색상 구별 (4번 요구사항) */
    .item-list { list-style: none; padding: 0; margin: 0; }
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
      border-radius: 4px;
      margin-bottom: 6px;
      background-color: #ffffff;
    }
    
    /* 사진 번호가 들어간 리스트 색상 표기 */
    .item-row.has-photo {
      background-color: #ebf8ff;
      border-left: 5px solid #3182ce;
    }
    .photo-badge {
      background-color: #3182ce;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.85em;
      font-weight: bold;
    }

    /* 탭 / 모달 영역 (5번 요구사항) */
    .nav-tabs {
      display: flex;
      gap: 10px;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 15px;
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 10px 15px;
      font-size: 16px;
      color: #718096;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active {
      color: #2b6cb0;
      border-bottom-color: #2b6cb0;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 8px 12px;
      text-align: center;
    }
    th { background-color: #f7fafc; }
  </style>
</head>
<body>

  <!-- 상단 메뉴 및 저장/불러오기 영역 (2, 3번 요구사항) -->
  <div class="top-bar">
    <h2>사진번호 관리 시스템</h2>
    <div class="btn-group">
      <button class="btn-success" onclick="saveToFile()">저장하기</button>
      <button class="btn-info" onclick="document.getElementById('fileInput').click()">불러오기</button>
      <input type="file" id="fileInput" accept=".json" style="display:none;" onchange="loadFromFile(event)">
    </div>
  </div>

  <div class="card">
    <!-- 탭 메뉴 (5번 요구사항 포함) -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('list-tab')">목록 및 입력</button>
      <button class="tab-btn" onclick="switchTab('mapping-tab')">인덱스별 사진 현황 (매핑 뷰어)</button>
    </div>

    <!-- 1번 탭: 리스트 및 사진번호 입력 -->
    <div id="list-tab" class="tab-content active">
      <!-- 1번 요구사항: 사진번호 4자리 입력 영역 -->
      <div class="photo-input-group">
        <label for="targetIndex">인덱스 선택:</label>
        <select id="targetIndex" style="padding: 8px;"></select>

        <label for="photoNum">사진번호 (4자리):</label>
        <input type="text" id="photoNum" maxlength="4" placeholder="0001">
        
        <button class="btn-primary" onclick="assignPhotoNumber()">사진번호 등록</button>
      </div>

      <!-- 4번 요구사항: 사진번호가 적용된 항목 색상 구별 리스트 -->
      <ul id="itemList" class="item-list"></ul>
    </div>

    <!-- 5번 탭: 인덱스 번호별 해당 사진 한눈에 보기 -->
    <div id="mapping-tab" class="tab-content">
      <h3>인덱스 - 사진번호 매핑 현황</h3>
      <table>
        <thead>
          <tr>
            <th>인덱스 번호</th>
            <th>항목 명칭</th>
            <th>할당된 사진번호</th>
          </tr>
        </thead>
        <tbody id="mappingTableBody">
          <!-- 스크립트로 동적 생성 -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // 샘플 데이터 상태
    let items = [
      { index: 1, name: "전경 촬영", photoNo: "" },
      { index: 2, name: "자재 입고 검수", photoNo: "1001" },
      { index: 3, name: "기초 공사 진행", photoNo: "" },
      { index: 4, name: "배선 작업 확인", photoNo: "1002" },
      { index: 5, name: "최종 점검", photoNo: "" }
    ];

    let logs = []; // 변경 이력 로그

    // 초기화
    document.addEventListener("DOMContentLoaded", () => {
      renderList();
      populateIndexSelect();
    });

    // 화면 리스트 렌더링 (4번 요구사항 반영)
    function renderList() {
      const listEl = document.getElementById("itemList");
      const tableBodyEl = document.getElementById("mappingTableBody");
      
      listEl.innerHTML = "";
      tableBodyEl.innerHTML = "";

      items.forEach(item => {
        // 1. 목록 렌더링
        const li = document.createElement("li");
        const hasPhoto = item.photoNo.trim() !== "";
        li.className = `item-row ${hasPhoto ? 'has-photo' : ''}`;
        
        li.innerHTML = `
          <div>
            <strong>[Index ${item.index}]</strong> ${item.name}
          </div>
          <div>
            ${hasPhoto 
              ? `<span class="photo-badge">사진 NO. ${item.photoNo}</span>` 
              : `<span style="color:#a0aec0; font-size:0.9em;">미등록</span>`}
          </div>
        `;
        listEl.appendChild(li);

        // 2. 인덱스 매핑 테이블 렌더링 (5번 요구사항)
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.index}</td>
          <td>${item.name}</td>
          <td>${hasPhoto ? `<strong>${item.photoNo}</strong>` : '-'}</td>
        `;
        tableBodyEl.appendChild(tr);
      });
    }

    // 인덱스 드롭다운 채우기
    function populateIndexSelect() {
      const selectEl = document.getElementById("targetIndex");
      selectEl.innerHTML = "";
      items.forEach(item => {
        const opt = document.createElement("option");
        opt.value = item.index;
        opt.textContent = `Index ${item.index} - ${item.name}`;
        selectEl.appendChild(opt);
      });
    }

    // 1번 요구사항: 4자리 사진번호 등록 및 로그 저장
    function assignPhotoNumber() {
      const index = parseInt(document.getElementById("targetIndex").value);
      const photoNum = document.getElementById("photoNum").value.trim();

      if (!/^\d{4}$/.test(photoNum)) {
        alert("사진번호는 숫자 4자리로 입력해주세요. (예: 0001)");
        return;
      }

      const target = items.find(i => i.index === index);
      if (target) {
        target.photoNo = photoNum;
        
        // 로그 기록 추가
        const logEntry = {
          timestamp: new Date().toISOString(),
          index: index,
          photoNo: photoNum
        };
        logs.push(logEntry);

        alert(`[Index ${index}] 항목에 사진번호 [${photoNum}]가 등록되었습니다.`);
        document.getElementById("photoNum").value = "";
        renderList();
      }
    }

    // 2번 요구사항: 년월일시간 파일명으로 저장하기 (JSON)
    function saveToFile() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      const fileName = `${year}${month}${day}_${hours}${minutes}${seconds}.json`;

      const dataToSave = {
        savedAt: now.toLocaleString(),
        items: items,
        logs: logs
      };

      const blob = new Blob([JSON.stringify(dataToSave, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    // 3번 요구사항: 저장된 JSON 파일 불러오기
    function loadFromFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (importedData.items) {
            items = importedData.items;
            logs = importedData.logs || [];
            renderList();
            populateIndexSelect();
            alert("파일을 성공적으로 불러왔습니다.");
          } else {
            alert("올바르지 않은 파일 형식입니다.");
          }
        } catch (err) {
          alert("JSON 파일을 읽는 중 오류가 발생했습니다.");
        }
      };
      reader.readAsText(file);
      event.target.value = ""; // 동일 파일 다시 업로드 가능하도록 초기화
    }

    // 탭 전환 핸들러
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }
  </script>
</body>
</html>
